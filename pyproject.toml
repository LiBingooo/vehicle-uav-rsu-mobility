[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-mobility-scenes"
version = "0.1.0"
description = "Vehicle trajectories, prescribed UAV paths, RSU deployment and scene playback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
viz = ["numpy>=1.24,<3", "pandas>=2,<3", "matplotlib>=3.8,<4", "Pillow>=10"]

[project.scripts]
vec-mobility = "vec_mobility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

